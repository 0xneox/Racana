# Racana — Background Worker (BullMQ consumer + Typst renderer)
# Image: Dockerfile.worker — runs dist/worker.cjs (bundled scripts/worker.ts).
# The web service must set RACANA_EMBEDDED_WORKER=false so only this machine
# consumes the queue.

app = "racana-worker"
primary_region = "bom"  # Mumbai = lowest latency to Supabase ap-south-1

[build]
  dockerfile = "Dockerfile.worker"

[env]
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"
  TYPESETTING_ENGINE = "typst"
  RACANA_ROOT = "/app"
  PORT = "9090"
  # NO secrets here — use `fly secrets set` (they are redacted from deploys)

[[services]]
  # Worker doesn't need public HTTP, but Fly requires at least one service for health-checks.
  # scripts/worker.ts serves GET /health on $PORT (200 = consumer running + Redis ready).
  internal_port = 9090
  protocol = "tcp"
  auto_stop_machines = "off"    # NEVER auto-stop the worker (BullMQ needs a persistent connection)
  auto_start_machines = "off"
  min_machines_running = 1

  [[services.http_checks]]
    interval = 60000
    grace_period = "30s"
    method = "get"
    path = "/health"
    protocol = "http"
    timeout = "5s"

# Each job runs two full Typst compiles (clean + preview), a PNG preview
# pass and pdfjs text extraction, with 2 jobs in parallel. 256 MB OOMs.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
