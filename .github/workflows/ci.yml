name: CI

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: racana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d racana_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/racana_test?schema=public
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-not-for-production
      NEXTAUTH_SECRET: ci-nextauth-secret-not-for-production
      RESEND_API_KEY: re_placeholder
      APP_URL: http://localhost:3000
      RAZORPAY_KEY_ID: rzp_test_ci
      RAZORPAY_KEY_SECRET: ci-razorpay-secret
      RAZORPAY_WEBHOOK_SECRET: ci-webhook-secret
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      - run: npm run build:worker
      - run: npm run build
